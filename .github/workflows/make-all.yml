name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Verify make all
        run: make all

  execution-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build execution worker
        run: |
          docker build \
            --target execution-worker \
            --build-arg SYMPHONY_WORKER_IMAGE=symphony-worker:${GITHUB_SHA} \
            --build-arg SYMPHONY_WORKER_SOURCE_REVISION=${GITHUB_SHA} \
            --tag symphony-worker:${GITHUB_SHA} \
            .

      - name: Verify non-root runtime and toolchain
        run: |
          test "$(docker run --rm --entrypoint id symphony-worker:${GITHUB_SHA} -u)" != "0"
          docker run --rm --entrypoint bash symphony-worker:${GITHUB_SHA} -lc \
            'command -v codex && command -v git && command -v make && command -v cc && command -v mix && command -v elixir'

      - name: Run required gate in clean worker image
        run: |
          docker run --rm \
            --entrypoint bash \
            --volume "${PWD}:/source:ro" \
            symphony-worker:${GITHUB_SHA} \
            -lc 'cp -a /source/. /worker/workspaces/symphony && cd /worker/workspaces/symphony && make all'
