name: publish-image

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      started-at: ${{ steps.timing.outputs.started_at }}
    steps:
      - name: Record workflow start
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run publish lint
        run: mix credo --strict

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check formatting (non-blocking diagnostic)
        id: format
        shell: bash
        run: |
          set +e
          mix format --check-formatted
          status=$?
          if [[ $status -eq 0 ]]; then
            echo "- Formatting: pass" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Formatting: drift detected (non-blocking); remediate via the blocking [quality workflow](../actions/workflows/make-all.yml)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate local and published Compose models
        env:
          DATABASE_URL: postgresql://symphony:test@postgres/symphony
          POSTGRES_PASSWORD: test
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --format json | jq -e '
            .services.migrate.image == "symphony:local" and
            .services.symphony.image == "symphony:local" and
            .services.migrate.build.target == "symphony" and
            .services.symphony.build.target == "symphony"
          '
          export SYMPHONY_IMAGE=ghcr.io/vikingmew/symphony:sha-0123456789abcdef0123456789abcdef01234567
          export SYMPHONY_EXECUTION_WORKER_IMAGE=ghcr.io/vikingmew/symphony-execution-worker:sha-0123456789abcdef0123456789abcdef01234567
          docker compose -f compose.yaml -f compose.published.yaml --profile execution-worker config --format json | jq -e '
            .services.migrate.image == env.SYMPHONY_IMAGE and
            .services.symphony.image == .services.migrate.image and
            (.services.migrate | has("build") | not) and
            (.services.symphony | has("build") | not) and
            .services.migrate.pull_policy == "always" and
            .services.symphony.pull_policy == "always" and
            .services.symphony.environment.SYMPHONY_EXECUTION_MODE == "worker" and
            ([.services.symphony.volumes[].source] | index("codex_home") | not) and
            .services["execution-worker"].image == env.SYMPHONY_EXECUTION_WORKER_IMAGE and
            (.services["execution-worker"] | has("build") | not) and
            .services["execution-worker"].pull_policy == "always" and
            .services["execution-worker"].profiles == ["execution-worker"]
          '

  publish:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vikingmew/symphony
      WORKER_IMAGE: ghcr.io/vikingmew/symphony-execution-worker
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Detect reusable BuildKit cache
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/symphony-buildkit-cache-marker
          key: symphony-buildkit-linux-amd64-arm64-${{ hashFiles('Dockerfile', 'mix.lock') }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke runtime toolchain targets
        shell: bash
        run: |
          set -euo pipefail
          docker build --target symphony --tag symphony-toolchain:symphony-centralized .
          docker build --target symphony --build-arg SYMPHONY_EMBED_CODEX=false --tag symphony-toolchain:symphony .
          docker build --target worker --tag symphony-toolchain:worker .
          docker build --target execution-worker --tag symphony-toolchain:execution-worker .

          docker run --rm --read-only --user 10001:10001 \
            --tmpfs /tmp:rw,mode=1777 --tmpfs /data/workspaces:rw,mode=1777 \
            symphony-toolchain:symphony-centralized sh -lc '
              command -v mise && command -v mix && command -v elixir && command -v erl && command -v make && command -v gh &&
              command -v node && command -v codex && test "$CODEX_HOME" = /home/symphony/.codex &&
              test "$(git config --system --get-all credential.https://github.com.helper)" = "!gh auth git-credential" &&
              test "$(git config --system --get-all url.https://github.com/.insteadOf)" = "git@github.com:" &&
              mise --version && mix --version
            '
          docker run --rm --read-only --user 10001:10001 \
            --tmpfs /tmp:rw,mode=1777 --tmpfs /data/workspaces:rw,mode=1777 \
            symphony-toolchain:symphony sh -lc '
              command -v mise && command -v mix && command -v elixir && command -v erl && command -v make && command -v gh &&
              ! command -v node && ! command -v codex && test -z "${CODEX_HOME:-}"
            '
          docker run --rm --read-only --user 1000:1000 \
            --tmpfs /tmp:rw,mode=1777 --tmpfs /workspace:rw,mode=1777 \
            symphony-toolchain:worker sh -lc '
              command -v mise && command -v mix && command -v elixir && command -v erl && command -v make && command -v gh &&
              test "$(git config --system --get-all credential.https://github.com.helper)" = "!gh auth git-credential" &&
              test "$(git config --system --get-all url.https://github.com/.insteadOf)" = "git@github.com:" &&
              mise --version && mix --version
            '
          docker run --rm --read-only --user 10002:10002 \
            --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /worker/cache:rw,exec,mode=1777 \
            --tmpfs /worker/workspaces:rw,exec,mode=1777 \
            --mount type=bind,source="$PWD",target=/source,readonly \
            symphony-toolchain:execution-worker sh -lc '
              command -v mise && command -v mix && command -v elixir && command -v erl && command -v make && command -v gh &&
              test "$(git config --system --get-all credential.https://github.com.helper)" = "!gh auth git-credential" &&
              test "$(git config --system --get-all url.https://github.com/.insteadOf)" = "git@github.com:" &&
              mise --version && mix --version &&
              cp -R /source/. /worker/workspaces/symphony &&
              cd /worker/workspaces/symphony &&
              mise exec -- mix --version
            '

      - name: Select immutable and mutable tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          worker_tags="${WORKER_IMAGE}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=$'\n'"${IMAGE}:latest"
            worker_tags+=$'\n'"${WORKER_IMAGE}:latest"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag does not follow vMAJOR.MINOR.PATCH[-prerelease]: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            release_tag="${IMAGE}:${GITHUB_REF_NAME}"
            if docker buildx imagetools inspect "$release_tag" >/dev/null 2>&1; then
              echo "Immutable release tag already exists: $release_tag" >&2
              exit 1
            fi
            tags+=$'\n'"$release_tag"
            worker_release_tag="${WORKER_IMAGE}:${GITHUB_REF_NAME}"
            if docker buildx imagetools inspect "$worker_release_tag" >/dev/null 2>&1; then
              echo "Immutable release tag already exists: $worker_release_tag" >&2
              exit 1
            fi
            worker_tags+=$'\n'"$worker_release_tag"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "worker-tags<<EOF"
            echo "$worker_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable SHA tag
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="${IMAGE}:sha-${GITHUB_SHA}"
          if digest="$(docker buildx imagetools inspect "$sha_tag" --format '{{json .Manifest.Digest}}' 2>/dev/null | jq -r .)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish both platforms
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: symphony
          build-args: SYMPHONY_EMBED_CODEX=false
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=symphony-linux-amd64-arm64
          cache-to: type=gha,mode=max,scope=symphony-linux-amd64-arm64
          provenance: false
          sbom: false

      - name: Resolve immutable worker SHA tag
        id: worker-existing
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="${WORKER_IMAGE}:sha-${GITHUB_SHA}"
          if digest="$(docker buildx imagetools inspect "$sha_tag" --format '{{json .Manifest.Digest}}' 2>/dev/null | jq -r .)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish worker on both platforms
        id: worker-build
        if: steps.worker-existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: execution-worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.worker-tags }}
          cache-from: type=gha,scope=execution-worker-linux-amd64-arm64
          cache-to: type=gha,mode=max,scope=execution-worker-linux-amd64-arm64
          provenance: false
          sbom: false

      - name: Add tags to an existing immutable SHA image
        if: steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          source_ref="${IMAGE}@${{ steps.existing.outputs.digest }}"
          while IFS= read -r tag; do
            [[ "$tag" == "${IMAGE}:sha-${GITHUB_SHA}" ]] && continue
            if [[ "$tag" != "${IMAGE}:latest" ]] && docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "Immutable release tag already exists: $tag" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$tag" "$source_ref"
          done <<< "$TAGS"

      - name: Add tags to an existing immutable worker SHA image
        if: steps.worker-existing.outputs.exists == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.worker-tags }}
        run: |
          set -euo pipefail
          source_ref="${WORKER_IMAGE}@${{ steps.worker-existing.outputs.digest }}"
          while IFS= read -r tag; do
            [[ "$tag" == "${WORKER_IMAGE}:sha-${GITHUB_SHA}" ]] && continue
            if [[ "$tag" != "${WORKER_IMAGE}:latest" ]] && docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "Immutable release tag already exists: $tag" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$tag" "$source_ref"
          done <<< "$TAGS"

      - name: Resolve published digest
        id: published
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: echo "digest=${BUILT_DIGEST:-$EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve published worker digest
        id: worker-published
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.worker-build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.worker-existing.outputs.digest }}
        run: echo "digest=${BUILT_DIGEST:-$EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Mark BuildKit cache available
        if: steps.build.outcome == 'success' || steps.worker-build.outcome == 'success'
        run: touch /tmp/symphony-buildkit-cache-marker

      - name: Inspect manifest platforms
        id: manifest
        shell: bash
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          manifest="$(docker buildx imagetools inspect --raw "$ref")"
          platforms="$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' <<< "$manifest" | sort -u)"
          expected=$'linux/amd64\nlinux/arm64'
          if [[ "$platforms" != "$expected" ]]; then
            echo "Expected exactly amd64 and arm64, found:" >&2
            echo "$platforms" >&2
            exit 1
          fi
          amd64_digest="$(jq -er '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
            | if length == 1
              then (.[0].digest | select(type == "string" and length > 0) // error("linux/amd64 child manifest has no digest"))
              else error("expected exactly one linux/amd64 child manifest")
              end
          ' <<< "$manifest")"
          arm64_digest="$(jq -er '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")]
            | if length == 1
              then (.[0].digest | select(type == "string" and length > 0) // error("linux/arm64 child manifest has no digest"))
              else error("expected exactly one linux/arm64 child manifest")
              end
          ' <<< "$manifest")"
          printf 'platforms<<EOF\n%s\nEOF\n' "$platforms" >> "$GITHUB_OUTPUT"
          echo "amd64-digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64-digest=$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Smoke published release on both platforms
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64-digest }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 "${IMAGE}@${AMD64_DIGEST}" \
            sh -lc '/app/bin/symphony version && ! command -v node && ! command -v codex && test -z "${CODEX_HOME:-}"'
          docker run --rm --platform linux/arm64 "${IMAGE}@${ARM64_DIGEST}" \
            sh -lc '/app/bin/symphony version && ! command -v node && ! command -v codex && test -z "${CODEX_HOME:-}"'

      - name: Inspect worker manifest platforms
        id: worker-manifest
        shell: bash
        env:
          DIGEST: ${{ steps.worker-published.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${WORKER_IMAGE}@${DIGEST}"
          manifest="$(docker buildx imagetools inspect --raw "$ref")"
          platforms="$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' <<< "$manifest" | sort -u)"
          expected=$'linux/amd64\nlinux/arm64'
          [[ "$platforms" == "$expected" ]] || { echo "Expected exactly amd64 and arm64, found: $platforms" >&2; exit 1; }
          amd64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected exactly one linux/amd64 child manifest") end' <<< "$manifest")"
          arm64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else error("expected exactly one linux/arm64 child manifest") end' <<< "$manifest")"
          printf 'platforms<<EOF\n%s\nEOF\n' "$platforms" >> "$GITHUB_OUTPUT"
          echo "amd64-digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64-digest=$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Smoke published worker on both platforms
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.worker-manifest.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.worker-manifest.outputs.arm64-digest }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh "${WORKER_IMAGE}@${AMD64_DIGEST}" \
            -lc 'test "$(id -u)" = 10002 && codex --version && mise --version && mix --version'
          docker run --rm --platform linux/arm64 --entrypoint sh "${WORKER_IMAGE}@${ARM64_DIGEST}" \
            -lc 'test "$(id -u)" = 10002 && codex --version && mise --version && mix --version'

  summary:
    if: always()
    needs: [quality-gate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize publication outcome
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality-gate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [[ "$QUALITY_RESULT" != success ]]; then outcome="prerequisite-failure"; elif [[ "$PUBLISH_RESULT" == success ]]; then outcome="published"; elif [[ "$PUBLISH_RESULT" == skipped ]]; then outcome="skipped"; else outcome="publication-failure"; fi
          {
            echo "## Publish summary"
            echo "- Outcome: **$outcome**"
            echo "- Completed (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Quality gate: $QUALITY_RESULT; publish job: $PUBLISH_RESULT"
            tags="sha-${GITHUB_SHA}"
            [[ "$GITHUB_REF" == refs/heads/main ]] && tags+=", latest"
            echo "- Tags: $tags"
          } >> "$GITHUB_STEP_SUMMARY"
