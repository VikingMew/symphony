agent:
  max_turns: 20
analytics:
  refinement_rounds_average_max: 2.0
  first_handoff_observed_return_rate_max: 0.5
  blocked_rate_max: 0.25
  latest_description_length_min: 200
  rework_rate_max: 0.5
  per_issue_total_tokens_max: 1000000
codex:
  approval_policy: "never"
  command: "codex --config 'model=\"gpt-5.5\"' --config model_reasoning_effort=xhigh app-server"
  thread_sandbox: "workspace-write"
  turn_sandbox_policy:
    type: "workspaceWrite"
polling:
  interval_ms: 5000
project:
  checkout_depth: 1
  cleanup_commands: ["mise exec -- mix workspace.before_remove"]
  default_branch: "main"
# NOTE: This file is an import/export artifact, not the live runtime source.
# PostgreSQL supplies project settings and profiles; the workflow policy below is
# a documentation/import example and runtime always uses the code contract.
# Hooks may be overridden per project in Settings / Projects.
  repository_url: "https://github.com/openai/symphony"
  required_gates:
    - name: "check"
      command: "scripts/check.sh"
      timeout_ms: 300000
    - name: "unit"
      command: "scripts/unit.sh"
      timeout_ms: 1800000
    - name: "dialyzer"
      command: "scripts/dialyzer.sh"
      timeout_ms: 1800000
  setup_commands: ["if command -v mise >/dev/null 2>&1; then mise trust && mise exec -- mix deps.get; fi"]
tracker:
  active_states: ["Todo", "Ready", "In Progress"]
  kind: "linear"
  project_slug: "symphony-0c79b11b75ea"
  terminal_states: ["Canceled", "Cancelled", "Duplicate", "Done"]
workflow:
  allowed_transitions: [{"actor": "codex", "from": "Todo", "profile": "refinement", "to": "Refining"}, {"actor": "codex", "from": "Refining", "profile": "refinement", "to": "Needs Refinement Review"}, {"actor": "human", "from": "Needs Refinement Review", "to": "Ready"}, {"actor": "human", "from": "Needs Refinement Review", "to": "Refining"}, {"actor": "codex", "from": "Ready", "profile": "implementation", "to": "In Progress"}, {"actor": "codex", "from": "In Progress", "profile": "implementation", "to": "Ready to Merge"}, {"actor": "human", "from": "Ready to Merge", "to": "In Progress"}, {"actor": "symphony", "from": "Todo", "to": "Blocked"}, {"actor": "symphony", "from": "Refining", "to": "Blocked"}, {"actor": "symphony", "from": "Ready", "to": "Blocked"}, {"actor": "symphony", "from": "In Progress", "to": "Blocked"}, {"actor": "symphony", "from": "Ready to Merge", "to": "Blocked"}, {"actor": "human", "from": "Blocked", "to": "Ready"}, {"actor": "human", "from": "Blocked", "to": "Needs Refinement Review"}, {"actor": "human", "from": "Blocked", "to": "Canceled"}]
  human_review_states: ["Needs Refinement Review", "Ready to Merge", "Blocked"]
  states:
    Todo:
      profile: "refinement"
    In Progress:
      profile: "implementation"
    Ready:
      profile: "implementation"
    Refining:
      profile: "refinement"
  tool_policy:
    linear:
      exposed_tools: ["linear_task_read", "linear_task_update"]
      raw_graphql: false
    github:
      exposed_tools: ["create_pull_request"]
      profiles: ["implementation"]
workspace:
  root: "~/code/symphony-workspaces"
